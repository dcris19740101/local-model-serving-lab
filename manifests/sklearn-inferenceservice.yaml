# Traditional ML path: CPU-only, no GPU resource request, no Hugging Face pull.
# Model comes from https://github.com/dcris19740101/ml-fundamentals
#
# Prep:
#   python -c "import joblib; joblib.dump(model, 'model.joblib')"
#   minikube mount /path/to/local/model/dir:/mnt/models
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: knn-classifier
spec:
  predictor:
    model:
      modelFormat:
        name: sklearn
      # Explicit runtime needed: kserve-mlserver, kserve-predictiveserver, and
      # kserve-sklearnserver all claim the sklearn modelFormat, so leaving this
      # unset is ambiguous rather than "auto-selected". kserve-sklearnserver is
      # the dedicated single-model sklearn runtime, the simplest match here.
      runtime: kserve-sklearnserver
      storageUri: pvc://model-pvc/knn
      resources:
        limits:
          cpu: "1"
          memory: 1Gi
---
# Test with (no ingress controller in this guide, port-forward instead):
#   kubectl port-forward svc/knn-classifier-predictor 8081:80
#   curl -v http://localhost:8081/v1/models/knn-classifier:predict \
#     -H "Content-Type: application/json" \
#     -d '{"instances": [[5.1, 3.5, 1.4, 0.2]]}'
