#   kubectl create secret generic hf-token-secret --from-literal=token=$(cat ~/.cache/huggingface/token)
apiVersion: v1
kind: Secret
metadata:
  name: hf-token-secret
type: Opaque
stringData:
  token: "REPLACE_ME_DO_NOT_COMMIT"
